openapi: 3.0.3
info:
  title: Travel Planner API
  version: 1.0.0
  description: |
    API for the Travel Planner service. This OpenAPI spec is a snapshot of the server
    endpoints and request/response shapes. Use this file to drive UI generation or
    to pass to LLMs for building integrations.
servers:
  - url: http://localhost:3000
paths:
  /plan-vacation:
    post:
      summary: Create a vacation planning task (queued)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanVacationRequest'
      responses:
        '200':
          description: Task accepted and queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskQueuedResponse'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /check-travel:
    post:
      summary: Quickly check visa eligibility / get destinations (cached)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckTravelRequest'
      responses:
        '200':
          description: Destinations matching visa eligibility
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DestinationSummary'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /task/{taskId}:
    get:
      summary: Get task status and logs
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
        - name: timestamp
          in: query
          required: false
          schema:
            type: integer
            description: Only return logs after this timestamp
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetailResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /task/{taskId}/cancel:
    post:
      summary: Cancel a task (queued or running)
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                taskToken:
                  type: string
                  description: Optional ownership token for verification (64 hex characters)
                  minLength: 64
                  maxLength: 64
      responses:
        '200':
          description: Task cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  taskId:
                    type: string
                  status:
                    type: string
        '400':
          description: Cannot cancel task (already completed/failed/cancelled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Invalid task token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /task/{taskId}/queue-position:
    get:
      summary: Get queue position for a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Queue position information
          content:
            application/json:
              schema:
                type: object
                properties:
                  taskId:
                    type: string
                  isQueued:
                    type: boolean
                  isActive:
                    type: boolean
                  position:
                    type: integer
                  totalQueued:
                    type: integer
        '404':
          description: Task not found in queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /queue/status:
    get:
      summary: Get queue status
      responses:
        '200':
          description: Queue status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueStatus'
  /airports:
    get:
      summary: List airports
      responses:
        '200':
          description: List of airports
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    iata:
                      type: string
                    airport:
                      type: string
                    region_name:
                      type: string
                    city_name:
                      type: string
                    country_code:
                      type: string
                    country_name:
                      type: string
  /countries:
    get:
      summary: List all countries with cost of living data
      responses:
        '200':
          description: List of countries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Country'
  /rates:
    get:
      summary: Get currency exchange rates
      responses:
        '200':
          description: Currency rates
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: number
  /visa-requirements:
    post:
      summary: Get detailed visa requirements for a specific destination
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nationality, destination]
              properties:
                nationality:
                  type: string
                  description: ISO2 country code
                residence:
                  type: string
                  description: ISO2 country code
                visas:
                  type: array
                  items:
                    type: string
                    description: ISO2 country codes of held visas
                destination:
                  type: string
                  description: ISO2 country code or name
      responses:
        '200':
          description: Visa requirements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisaRequirementResponse'
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Country not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /extract-trip-data:
    post:
      summary: Extract structured trip data from conversation transcripts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractTripDataRequest'
      responses:
        '200':
          description: Extracted trip data
          content:
            application/json:
              schema:
                type: object
                description: Structured trip data extracted by AI
        '500':
          description: Extraction failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /feedback:
    post:
      summary: Submit user feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '201':
          description: Feedback saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /itineraries/random:
    get:
      summary: Get a random recently completed itinerary
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 200
            description: Maximum number of recent itineraries to consider
        - name: since
          in: query
          required: false
          schema:
            type: integer
            description: Unix timestamp - only consider itineraries after this time (default is 7 days ago)
      responses:
        '200':
          description: Random itinerary
          content:
            application/json:
              schema:
                type: object
                properties:
                  taskId:
                    type: string
                  updatedAt:
                    type: integer
                  itinerary:
                    type: object
        '404':
          description: No itineraries found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
components:
  schemas:
    Traveler:
      type: object
      required: [type, nationality, residence]
      properties:
        name:
          type: string
          maxLength: 100
        type:
          type: string
          enum: [adult, child]
        nationality:
          type: string
          description: ISO2 country code (e.g., 'NG')
          minLength: 2
          maxLength: 2
        residence:
          type: string
          description: ISO2 country code
          minLength: 2
          maxLength: 2
        visas:
          type: array
          items:
            type: string
            description: ISO2 country codes of held visas
          default: []
          maxItems: 20
    PlanVacationRequest:
      type: object
      required: [travelers, budget, timeframe, duration, departureCountry, visaPreference, travelStyles]
      properties:
        travelers:
          type: array
          items:
            $ref: '#/components/schemas/Traveler'
        budget:
          type: string
          enum: [under-500, 500-1000, 1000-2000, 2000-5000, over-5000]
        timeframe:
          type: string
          enum: [1-month, 3-month, 6-month, flexible]
        duration:
          type: string
          enum: [3-5-days, 1-week, 2-weeks, 3-weeks, 1-month, flexible]
        departureCountry:
          type: string
          description: ISO3 country code (e.g., 'USA')
        visaPreference:
          type: string
          enum: [visa-free, visa-on-arrival, required, any]
        travelStyles:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 10
    CheckTravelRequest:
      type: object
      required: [nationality, residence, visaPreference]
      properties:
        nationality:
          type: string
        residence:
          type: string
        visas:
          type: array
          items:
            type: string
        visaPreference:
          type: string
    TaskQueuedResponse:
      type: object
      properties:
        taskId:
          type: string
        taskToken:
          type: string
          description: Ownership token for task verification (use for cancellation)
        status:
          type: string
          example: queued
        queuePosition:
          type: integer
        totalQueued:
          type: integer
        queued:
          type: boolean
        message:
          type: string
    TaskDetailResponse:
      type: object
      properties:
        taskId:
          type: string
        status:
          type: string
          description: 'pending | queued | active | completed | failed | cancelled'
        data:
          type: object
          description: Result data when status is completed
        error:
          type: string
          description: Error message when status is failed
        logs:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
              timestamp:
                type: integer
        queued:
          type: boolean
          description: True if task is waiting in queue
        isActive:
          type: boolean
          description: True if task is currently processing
        queuePosition:
          type: integer
          description: Position in queue (if queued)
        totalQueued:
          type: integer
          description: Total number of tasks in queue
    DestinationSummary:
      type: object
      properties:
        name:
          type: string
        countryCode:
          type: string
        airportCode:
          type: string
        visaStatus:
          type: string
    QueueStatus:
      type: object
      properties:
        activeCount:
          type: integer
        maxConcurrent:
          type: integer
        queuedCount:
          type: integer
        totalPending:
          type: integer
        queuedTasks:
          type: array
          items:
            type: object
            properties:
              taskId:
                type: string
              position:
                type: integer
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
    Country:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        code:
          type: string
          description: ISO2 country code
        capital:
          type: string
        region:
          type: string
        subregion:
          type: string
        languageCode:
          type: string
        currencyCode:
          type: string
        costIndex:
          type: number
        normalizedCostIndex:
          type: number
        emoji:
          type: string
          description: Flag emoji
    VisaRequirementResponse:
      type: object
      properties:
        destination:
          type: object
          properties:
            name:
              type: string
            code:
              type: string
            emoji:
              type: string
        nationality:
          type: string
        residence:
          type: string
          nullable: true
        visas:
          type: array
          items:
            type: string
        visaRequirement:
          type: object
          properties:
            requirement:
              type: string
              enum: [visa free, visa on arrival, eta, e-visa, visa required]
            baseRequirement:
              type: string
            appliedCondition:
              type: string
              nullable: true
            notes:
              type: string
              nullable: true
            conditionalRequirements:
              type: array
              nullable: true
              items:
                type: object
                properties:
                  condition:
                    type: string
                  requirement:
                    type: string
                  notes:
                    type: string
    ExtractTripDataRequest:
      type: object
      required: [transcriptHistory, extractionPrompt]
      properties:
        transcriptHistory:
          type: array
          items:
            type: object
            required: [role, content]
            properties:
              role:
                type: string
                enum: [user, assistant, system, model]
              content:
                type: string
                maxLength: 100000
          minItems: 1
          maxItems: 1000
        extractionPrompt:
          type: string
          maxLength: 50000
    FeedbackRequest:
      type: object
      required: [email]
      properties:
        name:
          type: string
          maxLength: 200
          nullable: true
        email:
          type: string
          format: email
          maxLength: 320
        message:
          type: string
          maxLength: 5000
          nullable: true
