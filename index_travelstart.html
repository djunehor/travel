
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travelstart x Arlo - Find Your Perfect Destination</title>
    <!-- SEO Meta Tags -->
    <meta name="description" content="Find your perfect travel destination with Travelstart x Arlo. Discover visa-free and budget-friendly trips tailored to your nationality, residence, and travel style. Plan your next adventure with ease!">
    <meta name="keywords" content="travel, visa-free, vacation, destination, flights, hotels, travel planner, travelstart, arlo, budget travel, trip planning, adventure, holiday, tourism">
    <meta name="robots" content="index, follow">
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Travelstart x Arlo - Find Your Perfect Destination">
    <meta property="og:description" content="Find your perfect travel destination with Travelstart x Arlo. Discover visa-free and budget-friendly trips tailored to your nationality, residence, and travel style. Plan your next adventure with ease!">
    <meta property="og:site_name" content="Travelstart x Arlo">
    <meta property="og:image" content="/og-image.png">
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Travelstart x Arlo - Find Your Perfect Destination">
    <meta name="twitter:description" content="Find your perfect travel destination with Travelstart x Arlo. Discover visa-free and budget-friendly trips tailored to your nationality, residence, and travel style. Plan your next adventure with ease!">

    <meta name="twitter:image" content="/og-image.png">

    <!-- End SEO Meta Tags -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .animate-spin {
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body class="min-h-screen bg-gray-50">
    <!-- Header -->
    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center">
                    <span class="text-white font-bold text-xl">T</span>
                </div>
                <span class="text-2xl font-bold text-gray-800">travelstart</span>
            </div>
            <nav class="hidden md:flex gap-8">
                <a href="#" class="text-gray-700 hover:text-blue-500 font-medium">Flights</a>
                <a href="#" class="text-gray-700 hover:text-blue-500 font-medium">Hotels</a>
                <a href="#" class="text-gray-700 hover:text-blue-500 font-medium">Cars</a>
            </nav>
            <div class="flex gap-4">
                <button class="text-blue-500 hover:text-blue-600 flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                    <span class="hidden md:inline">My Account</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Search Section -->
    <div class="bg-gradient-to-r from-blue-600 to-cyan-500 py-12">
        <div class="max-w-6xl mx-auto px-4">
            <h1 class="text-4xl font-bold text-white mb-2">Find Your Perfect Destination</h1>
            <p class="text-blue-100 mb-8">Discover visa-free destinations tailored to your preferences</p>
            
            <div class="bg-white rounded-lg shadow-lg p-6">
                <form id="searchForm">
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Nationality</label>
                            <input type="text" id="nationality" value="NG" placeholder="e.g., NG" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Residence Country</label>
                            <input type="text" id="residence" value="DE" placeholder="e.g., DE" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Existing Visas (comma-separated)</label>
                            <input type="text" id="existingVisas" placeholder="e.g., UK, US" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Departure Airport</label>
                            <input type="text" id="departureCode" value="FRA" placeholder="e.g., FRA" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent" required>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Budget Range</label>
                            <select id="budget" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                <option value="300-500">$300 - $500</option>
                                <option value="500-1000" selected>$500 - $1,000</option>
                                <option value="1000-2000">$1,000 - $2,000</option>
                                <option value="2000-5000">$2,000 - $5,000</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Trip Duration</label>
                            <select id="duration" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                <option value="1-3-days">1-3 days</option>
                                <option value="3-5-days" selected>3-5 days</option>
                                <option value="5-7-days">5-7 days</option>
                                <option value="7-14-days">7-14 days</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Timeframe</label>
                            <select id="timeframe" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                <option value="1-month" selected>Within 1 month</option>
                                <option value="3-months">Within 3 months</option>
                                <option value="6-months">Within 6 months</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Visa Preference</label>
                            <select id="visaPreference" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                <option value="visa-free" selected>Visa-free only</option>
                                <option value="visa-on-arrival">Include visa on arrival</option>
                                <option value="any">Any visa type</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Travel Styles</label>
                        <div class="flex flex-wrap gap-2" id="travelStyles">
                            <button type="button" class="style-btn px-4 py-2 rounded-full text-sm font-medium bg-gray-200 text-gray-700 hover:bg-gray-300 transition-colors" data-style="shopping-nightlife">Shopping & Nightlife</button>
                            <button type="button" class="style-btn px-4 py-2 rounded-full text-sm font-medium bg-gray-200 text-gray-700 hover:bg-gray-300 transition-colors" data-style="food-culinary">Food & Culinary</button>
                            <button type="button" class="style-btn px-4 py-2 rounded-full text-sm font-medium bg-gray-200 text-gray-700 hover:bg-gray-300 transition-colors" data-style="adventure-outdoor">Adventure & Outdoor</button>
                            <button type="button" class="style-btn px-4 py-2 rounded-full text-sm font-medium bg-gray-200 text-gray-700 hover:bg-gray-300 transition-colors" data-style="culture-history">Culture & History</button>
                            <button type="button" class="style-btn px-4 py-2 rounded-full text-sm font-medium bg-gray-200 text-gray-700 hover:bg-gray-300 transition-colors" data-style="beach-relaxation">Beach & Relaxation</button>
                            <button type="button" class="style-btn px-4 py-2 rounded-full text-sm font-medium bg-gray-200 text-gray-700 hover:bg-gray-300 transition-colors" data-style="nature-wildlife">Nature & Wildlife</button>
                        </div>
                    </div>

                    <button type="submit" id="searchBtn" class="w-full bg-gradient-to-r from-cyan-400 to-cyan-500 hover:from-cyan-500 hover:to-cyan-600 text-white font-bold py-3 px-6 rounded-lg transition-all flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                        <span>Search Destinations</span>
                    </button>
                </form>

                <!-- Loading State -->
                <div id="loadingState" class="hidden mt-6 text-center">
                    <div class="inline-flex items-center gap-3 bg-blue-50 px-6 py-4 rounded-lg">
                        <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-blue-600"></div>
                        <span class="text-blue-600 font-medium" id="loadingText">Searching for destinations...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Results Section -->
    <div id="resultsSection" class="hidden max-w-7xl mx-auto px-4 py-12">
        <h2 class="text-3xl font-bold text-gray-800 mb-8">Your Destination Options</h2>
        <div id="resultsContainer" class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6"></div>
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden max-w-7xl mx-auto px-4 py-12">
        <div class="bg-white rounded-lg shadow-lg p-12 text-center">
            <svg class="w-16 h-16 mx-auto text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
            <h3 class="text-2xl font-bold text-gray-800 mb-2">No destinations found</h3>
            <p class="text-gray-600">Try adjusting your search criteria or budget range</p>
        </div>
    </div>

    <script>
        let selectedStyles = [];
        let pollingInterval = null;

        // Travel style toggle
        document.querySelectorAll('.style-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const style = this.getAttribute('data-style');
                if (selectedStyles.includes(style)) {
                    selectedStyles = selectedStyles.filter(s => s !== style);
                    this.classList.remove('bg-blue-500', 'text-white');
                    this.classList.add('bg-gray-200', 'text-gray-700');
                } else {
                    selectedStyles.push(style);
                    this.classList.remove('bg-gray-200', 'text-gray-700');
                    this.classList.add('bg-blue-500', 'text-white');
                }
            });
        });

        // Form submission
        document.getElementById('searchForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const visasInput = document.getElementById('existingVisas').value;
            const visas = visasInput ? visasInput.split(',').map(v => v.trim().toUpperCase()) : [];
            
            const payload = {
                travelers: [{
                    name: "Traveler 1",
                    type: "adult",
                    nationality: document.getElementById('nationality').value.toUpperCase(),
                    residence: document.getElementById('residence').value.toUpperCase(),
                    visas: visas
                }],
                budget: document.getElementById('budget').value,
                timeframe: document.getElementById('timeframe').value,
                duration: document.getElementById('duration').value,
                departureCountry: document.getElementById('departureCode').value.toUpperCase(),
                visaPreference: document.getElementById('visaPreference').value,
                travelStyles: selectedStyles
            };

            // Show loading state
            document.getElementById('searchBtn').disabled = true;
            document.getElementById('loadingState').classList.remove('hidden');
            document.getElementById('resultsSection').classList.add('hidden');
            document.getElementById('emptyState').classList.add('hidden');

            try {
                // Submit search request
                const response = await fetch('https://vacation-planner.shagital.com/api/plan-vacation', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                const taskId = data.taskId;

                // Start polling for results
                pollTaskStatus(taskId);
            } catch (error) {
                console.error('Error submitting search:', error);
                document.getElementById('loadingText').textContent = 'Error occurred. Please try again.';
                document.getElementById('searchBtn').disabled = false;
            }
        });

        function pollTaskStatus(taskId) {
            let pollCount = 0;
            pollingInterval = setInterval(async () => {
                pollCount++;
                try {
                    const response = await fetch(`https://vacation-planner.shagital.com/api/task/${taskId}`);
                    const data = await response.json();

                    if (data.data && data.data.destinations) {
                        // Update loading text based on results
                        const count = data.data.destinations.length;
                        document.getElementById('loadingText').textContent = 
                            `Found ${count} destination${count !== 1 ? 's' : ''}... ${data.status === 'completed' ? 'Complete!' : 'Finding more...'}`;
                    }

                    if (data.status === 'completed') {
                        clearInterval(pollingInterval);
                        displayResults(data.data);
                        document.getElementById('loadingState').classList.add('hidden');
                        document.getElementById('searchBtn').disabled = false;
                    }
                } catch (error) {
                    console.error('Error polling task status:', error);
                    if (pollCount > 60) { // Stop after 5 minutes
                        clearInterval(pollingInterval);
                        document.getElementById('loadingText').textContent = 'Search timed out. Please try again.';
                        document.getElementById('searchBtn').disabled = false;
                    }
                }
            }, 5000); // Poll every 5 seconds
        }

        function displayResults(data) {
            const resultsContainer = document.getElementById('resultsContainer');
            const resultsSection = document.getElementById('resultsSection');
            const emptyState = document.getElementById('emptyState');

            if (!data.destinations || data.destinations.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }

            resultsContainer.innerHTML = '';
            resultsSection.classList.remove('hidden');

            data.destinations.forEach(dest => {
                const card = createDestinationCard(dest);
                resultsContainer.innerHTML += card;
            });
        }

        function createDestinationCard(dest) {
            const flightUrl = buildFlightUrl(dest);
            const hotelUrl = buildHotelUrl(dest);
            const activityUrl = dest.topActivities && dest.topActivities.length > 0 ? dest.topActivities[0].url : '#';

            const departDate = new Date(dest.flightDetails.departureDate);
            const returnDate = new Date(dest.flightDetails.returnDate);
            const dateRange = `${departDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} - ${returnDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;

            return `
                <div class="bg-white rounded-lg shadow-lg overflow-hidden hover:shadow-xl transition-shadow">
                    <!-- Header -->
                    <div class="bg-gradient-to-r from-blue-500 to-cyan-500 p-6 text-white">
                        <div class="flex items-start justify-between mb-2">
                            <div>
                                <h3 class="text-2xl font-bold">${dest.name}</h3>
                                <span class="inline-block bg-green-400 text-green-900 text-xs font-semibold px-3 py-1 rounded-full mt-2">
                                    ${dest.visaStatus.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ')}
                                </span>
                            </div>
                            <div class="text-right">
                                <div class="text-3xl font-bold">€${dest.estimatedCost.total}</div>
                                <div class="text-sm text-blue-100">total</div>
                            </div>
                        </div>
                    </div>

                    <!-- Cost Breakdown -->
                    <div class="p-6 border-b">
                        <div class="space-y-3">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-2 text-gray-600">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                                    </svg>
                                    <span>Flights</span>
                                </div>
                                <span class="font-semibold text-gray-800">€${dest.estimatedCost.flights}</span>
                            </div>
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-2 text-gray-600">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                                    </svg>
                                    <span>Accommodation</span>
                                </div>
                                <span class="font-semibold text-gray-800">€${dest.estimatedCost.accommodation}</span>
                            </div>
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-2 text-gray-600">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-2 1m2-1l-2-1m2 1v2.5M14 4l-2-1-2 1M4 7l2-1M4 7l2 1M4 7v2.5M12 21l-2-1m2 1l2-1m-2 1v-2.5M6 18l-2-1v-2.5M18 18l2-1v-2.5"></path>
                                    </svg>
                                    <span>Activities</span>
                                </div>
                                <span class="font-semibold text-gray-800">€${dest.estimatedCost.activities}</span>
                            </div>
                        </div>
                    </div>

                    <!-- Flight Details -->
                    <div class="p-6 border-b bg-gray-50">
                        <div class="flex items-center justify-between text-sm">
                            <div>
                                <div class="font-semibold text-gray-800">${dest.flightDetails.origin.city}</div>
                                <div class="text-gray-500">${dest.flightDetails.origin.iata}</div>
                            </div>
                            <div class="flex-1 mx-4">
                                <div class="border-t-2 border-dashed border-gray-300 relative">
                                    <svg class="w-4 h-4 absolute top-[-8px] left-1/2 transform -translate-x-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                                    </svg>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="font-semibold text-gray-800">${dest.flightDetails.destination.city}</div>
                                <div class="text-gray-500">${dest.flightDetails.destination.iata}</div>
                            </div>
                        </div>
                        <div class="mt-3 text-xs text-gray-600 text-center">${dateRange}</div>
                    </div>

                    <!-- Actions -->
                    <div class="p-6 space-y-3">
                        <a href="${flightUrl}" target="_blank" rel="noopener noreferrer" class="block w-full bg-cyan-400 hover:bg-cyan-500 text-white font-semibold py-3 px-4 rounded-lg text-center transition-colors">
                            Book Flights
                        </a>
                        <a href="${hotelUrl}" target="_blank" rel="noopener noreferrer" class="block w-full bg-white hover:bg-gray-50 text-blue-600 font-semibold py-3 px-4 rounded-lg text-center border-2 border-blue-600 transition-colors">
                            Book Hotel
                        </a>
                        ${dest.topActivities && dest.topActivities.length > 0 ? `
                        <a href="${activityUrl}" target="_blank" rel="noopener noreferrer" class="block w-full bg-white hover:bg-gray-50 text-gray-700 font-semibold py-3 px-4 rounded-lg text-center border border-gray-300 transition-colors">
                            View Activities
                        </a>
                        ` : ''}
                    </div>

                    <!-- Timeline Info -->
                    <div class="px-6 pb-6">
                        <div class="bg-blue-50 rounded-lg p-4 text-sm">
                            <div class="flex items-start gap-2">
                                <svg class="w-4 h-4 text-blue-600 mt-1 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                </svg>
                                <div>
                                    <div class="font-semibold text-gray-800 mb-1">Booking Timeline</div>
                                    <div class="text-gray-600">${dest.timeline.visaApplication}</div>
                                    <div class="text-gray-600 mt-1">Book by: ${dest.timeline.bookingDeadline}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function buildFlightUrl(dest) {
            // example final url: https://www.travelstart.co.za/search-on-index?version=3&timestamp=2025-12-02_19-56-46-056&from_0=FRA&from_type_0=airport&to_0=ORY&to_type_0=airport&depart_date_0=2025-12-17&from_1=ORY&from_type_1=airport&to_1=FRA&to_type_1=airport&depart_date_1=2025-12-21&is_flex_dates=false&trip_type=Roundtrip&adults=1&youngAdults=0&children=0&infants=0&currency=ZAR&cpy_source=tszaweb&correlation_id=67e4b8bf-cf4f-4bc2-b9f4-4f7d06a828e1&search=true&show_search_options=false&language=en&class=Economy
            const { origin, destination, departureDate, returnDate } = dest.flightDetails;
            // Generate timestamp in the required format: YYYY-MM-DD_HH-mm-ss-SSS
            function pad(n, width = 2) { return n.toString().padStart(width, '0'); }
            const now = new Date();
            const timestamp = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}_${pad(now.getHours())}-${pad(now.getMinutes())}-${pad(now.getSeconds())}-${pad(now.getMilliseconds(), 3)}`;

            const params = new URLSearchParams({
                version: '3',
                timestamp: timestamp,
                from_0: origin.iata,
                from_type_0: 'airport',
                to_0: destination.iata,
                to_type_0: 'airport',
                depart_date_0: departureDate,
                from_1: destination.iata,
                from_type_1: 'airport',
                to_1: origin.iata,
                to_type_1: 'airport',
                depart_date_1: returnDate,
                is_flex_dates: 'false',
                trip_type: 'Roundtrip',
                adults: '1',
                youngAdults: '0',
                children: '0',
                infants: '0',
                currency: 'ZAR',
                cpy_source: 'tszaweb',
                search: 'true',
                show_search_options: 'false',
                language: 'en',
                class: 'Economy'
            });
            return `https://www.travelstart.com.ng/search-on-index?${params.toString()}`;
        }

        function buildHotelUrl(dest) {
            const { destination, departureDate, returnDate } = dest.flightDetails;
            const cityName = destination.city.toLowerCase().replace(/\s+/g, '-');
            const country = destination.name.toLowerCase().replace(/\s+/g, '-');
            const params = new URLSearchParams({
                checkin: departureDate,
                checkout: returnDate,
                adults: '1',
                children: '0',
                infants: '0'
            });
            return `https://www.travelstart.co.za/accommodation/in/${cityName}-${country}?${params.toString()}`;
        }
    </script>
</body>
</html>
